name: BIB Intranet - CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bib-intranet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        
      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Test restock contract
        run: npm run test:restock

      - name: Test restock mirror and product permissions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/restock/mirror.sql

      - name: Test HR publication contract and release boundaries
        run: npm run test:hr-publications

      - name: Test HR publication permissions and writes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/hr-publications/permissions.sql

      - name: Test employee mutation contract and provisioning handler
        run: npm run test:hr-mutations

      - name: Test employee mutation permissions and atomic application
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/hr-mutations/workflow.sql

      - name: Test private onboarding invitation claims
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/hr-mutations/invitation-claims.sql

      - name: Typecheck employee provisioning boundary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --strictNullChecks --noImplicitAny false tests/hr-mutations/edge-env.d.ts supabase/functions/provision-employee-account/index.ts

      - name: Test authentication and task views
        run: npm run test:work-tasks

      - name: Test task collaboration permissions and immutable history
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/work-tasks/permissions.sql

      - name: Test pole and transversal contracts
        run: npm run test:intranet

      - name: Test module workflows, server permissions and document services
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/intranet/permissions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/intranet/services.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/intranet/identity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/intranet/gateway-replies.sql

      - name: Test Support workflow, customer context and resolution metrics
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/support-tickets/workflow.sql

      - name: Test quality findings, independent validation and audit mission authority
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/quality/workflow.sql

      - name: Test Work module lifecycle and activity feed
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/work-module/workflow.sql

      - name: Typecheck Drive, ethics, Gateway and test-account boundaries
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --strictNullChecks --noImplicitAny false --allowImportingTsExtensions tests/intranet/edge-env.d.ts supabase/functions/intranet-drive/index.ts supabase/functions/intranet-ethics/index.ts supabase/functions/gateway-dispatch/index.ts supabase/functions/process-email-queue/index.ts supabase/functions/provision-test-accounts/index.ts

      - name: Typecheck application
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build application
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

