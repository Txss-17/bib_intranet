name: BIB Intranet - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bib-intranet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        
      - name: Install dependencies
        run: npm ci

      - name: Test restock contract
        run: npm run test:restock

      - name: Test restock mirror and product permissions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/restock/mirror.sql

      - name: Typecheck application
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build application
        run: npm run build
